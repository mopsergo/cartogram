[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcarto"
version = "1.0.0"
description = "Offline-Pipeline für das Animated Energy Cartogram (ultragram)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "shapely>=2.1", "geopandas>=1.0",
    "pyproj>=3.7", "pyarrow>=15", "pyyaml>=6.0", "mapbox_earcut>=1.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
