<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Energy Cartogram · 1820–2020</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: rgba(20, 26, 36, 0.92);
      --border: #2c3646;
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #4dd0e1;
      --accent-warm: #ffb02e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    .hud {
      position: absolute; z-index: 10;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
      backdrop-filter: blur(6px);
    }
    #title {
      top: 14px; left: 14px; max-width: 330px;
    }
    #title h1 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
    #title p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

    #controls {
      top: 14px; right: 14px; width: 250px; display: flex;
      flex-direction: column; gap: 10px;
      max-height: calc(100vh - 28px);
      overflow-y: auto; overscroll-behavior: contain;
    }
    .group { display: flex; flex-direction: column; gap: 5px; }
    .group > label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); font-weight: 600;
    }
    .btnrow { display: flex; gap: 6px; }
    .btnrow button {
      flex: 1; padding: 6px 4px; font-size: 12.5px; cursor: pointer;
      background: #1c2431; color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; transition: all 0.12s ease;
    }
    .btnrow button:hover { border-color: var(--accent); }
    .btnrow button.active {
      background: var(--accent); color: #06222a; border-color: var(--accent);
      font-weight: 650;
    }
    select {
      background: #1c2431; color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 8px; font-size: 13px; width: 100%;
    }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .toggle input { accent-color: var(--accent); }

    #legend { padding: 8px 10px; }
    #legend canvas { width: 100%; height: 14px; border-radius: 4px; display: block; }
    #legend .range {
      display: flex; justify-content: space-between; margin-top: 3px;
      font-size: 11px; color: var(--muted);
    }
    #legend .caption { font-size: 11px; color: var(--muted); margin-top: 4px; }

    #timeline {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      width: min(760px, calc(100% - 28px));
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    }
    #playBtn {
      width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
      background: var(--accent); border: none; color: #06222a;
      font-size: 15px; cursor: pointer; display: flex; align-items: center;
      justify-content: center;
    }
    #yearDisplay {
      font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 700;
      min-width: 62px; text-align: center; color: var(--accent-warm);
    }
    #yearSlider { flex: 1; accent-color: var(--accent); }
    .speedwrap { display: flex; align-items: center; gap: 6px; }
    .speedwrap span { font-size: 11px; color: var(--muted); }
    .speedwrap select { width: 74px; }

    #worldchart {
      left: 14px; bottom: 76px; width: 252px; padding: 9px 11px 8px;
      user-select: none;
    }
    #worldchart .wc-title {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); font-weight: 600; margin-bottom: 5px;
    }
    #worldchart .wc-title.wc-second { margin-top: 7px; }
    #worldchart svg {
      display: block; width: 100%; height: 80px; cursor: crosshair;
    }
    #worldchart .wc-legend {
      display: flex; flex-direction: column; gap: 2px; margin-top: 6px;
      font-size: 11.5px;
    }
    #worldchart .wc-legend .row { display: flex; align-items: center; gap: 6px; }
    #worldchart .wc-legend i {
      width: 14px; height: 3px; border-radius: 2px; display: inline-block;
      flex: 0 0 auto;
    }
    #worldchart .wc-legend .nm { color: var(--muted); flex: 1; }
    #worldchart .wc-legend .v { font-variant-numeric: tabular-nums; }

    #detail {
      top: 130px; right: 14px; width: 250px; display: none;
    }
    #detail.show { display: block; }
    #detail h2 { margin: 0 0 1px; font-size: 15px; }
    #detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    #detail .row {
      display: flex; justify-content: space-between; font-size: 12.5px;
      padding: 3px 0; border-bottom: 1px dashed #232d3d;
    }
    #detail .row .v { font-variant-numeric: tabular-nums; }
    #detail canvas { width: 100%; height: 84px; margin-top: 8px; }
    #detail .hint { font-size: 10.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    #detail .close {
      position: absolute; top: 6px; right: 8px; cursor: pointer;
      color: var(--muted); font-size: 15px; background: none; border: none;
    }

    #tooltip {
      position: absolute; z-index: 20; pointer-events: none; display: none;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 9px; font-size: 12.5px;
      white-space: nowrap;
    }
    #tooltip .name { font-weight: 650; }
    #tooltip .val { color: var(--accent-warm); font-variant-numeric: tabular-nums; }

    .noselect { user-select: none; -webkit-user-select: none; }
    @media (prefers-reduced-motion: reduce) {
      #playBtn { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="title" class="hud">
    <h1>Bevölkerung &amp; Energie 1820–2020</h1>
    <p>Cartogramm: Fläche = <span id="areaLabel">Bevölkerungsanteil</span> ·
       Farbe = Energieverbrauch pro Kopf ·
       Höhe = Energieverbrauch pro Kopf (umstellbar)</p>
  </div>
  <div id="controls" class="hud">
    <div class="group">
      <label>Ansicht</label>
      <div class="btnrow" id="viewBtns">
        <button data-mode="flat">Flach</button>
        <button data-mode="extruded" class="active">2.5D</button>
        <button data-mode="globe">Globus</button>
      </div>
    </div>
    <div class="group" id="geoGroup">
      <label>Geometrie</label>
      <label class="toggle"><input type="checkbox" id="geoToggle" />
        Original-Geografie (unverzerrt) · Taste G</label>
    </div>
    <div class="group" id="runGroup">
      <label>Kartogramm-Lauf</label>
      <select id="runSelect" title="Exportierte Version des Solvers">
        <option value="current">Aktuell (mit Reparaturen)</option>
        <option value="legacy">Original (Commit, 16 h)</option>
      </select>
    </div>
    <div class="group" id="variantGroup">
      <label>Kartogramm-Fläche</label>
      <select id="variantSelect"
        title="Zielfläche, auf die jedes Land skaliert wird">
        <option value="population">Bevölkerungsanteil</option>
        <option value="energy">Gesamtenergie</option>
        <option value="percapita">Energie pro Kopf</option>
      </select>
    </div>
    <div class="group">
      <label>Farbkennzahl</label>
      <select id="metricSelect">
        <option value="3" selected>Energie pro Kopf (kWh)</option>
        <option value="2">Gesamtenergie (Mtoe)</option>
        <option value="0">Bevölkerung</option>
        <option value="1">Anteil Weltbevölkerung</option>
      </select>
      <select id="colorScaleSelect"
        title="Transformation der Farbskala – die Skala beginnt am Datenminimum; Wurzel spreizt kleine Werte, Linear zeigt Verhältnisse proportional, Log spreizt über Größenordnungen">
        <option value="sqrt" selected>Wurzel (kleine Werte betont)</option>
        <option value="linear">Linear (proportional)</option>
        <option value="log">Logarithmus</option>
      </select>
    </div>
    <div class="group" id="heightGroup">
      <label>2.5D-Optionen</label>
      <label class="toggle"><input type="checkbox" id="heightToggle" checked />
        Höhe anzeigen</label>
      <select id="heightSelect" title="Kennzahl für die Extrusionshöhe">
        <option value="3" selected>Energie pro Kopf (kWh)</option>
        <option value="2">Gesamtenergie (Mtoe)</option>
        <option value="0">Bevölkerung</option>
        <option value="1">Anteil Weltbevölkerung</option>
      </select>
      <select id="heightScaleSelect"
        title="Höhentransformation – Skala gegen das Jahres-Maximum">
        <option value="sqrt" selected>Wurzel (kleine Werte betont)</option>
        <option value="linear">Linear (proportional)</option>
        <option value="square">Quadrat (Spitzen differenzieren)</option>
      </select>
    </div>
    <div class="group" id="flatGroup" style="display:none">
      <label>Referenz-Ebene</label>
      <label class="toggle"><input type="checkbox" id="ghostToggle" checked />
        Original-Ländergrenzen im Hintergrund</label>
    </div>
    <div id="legend" class="hud" style="position:static; padding: 0;">
      <canvas id="legendBar"></canvas>
      <div class="range"><span id="legendMin"></span><span id="legendMax"></span></div>
      <div class="caption" id="legendCaption"></div>
      <div class="caption" id="legendArea" style="color: var(--accent-warm)"></div>
    </div>
    <div class="group"><button id="resetCam" style="width:100%; padding:6px; background:#1c2431; color:var(--text); border:1px solid var(--border); border-radius:7px; cursor:pointer;">Kamera zurücksetzen</button></div>
  </div>
  <div id="detail" class="hud">
    <button class="close" id="detailClose">✕</button>
    <h2 id="detailName"></h2>
    <div class="meta" id="detailMeta"></div>
    <div id="detailRows"></div>
    <canvas id="sparkline"></canvas>
    <div class="hint" id="detailHint"></div>
  </div>
  <div id="timeline" class="hud">
    <button id="playBtn" title="Abspielen/Pause (Leertaste)">▶</button>
    <div id="yearDisplay">1820</div>
    <input type="range" id="yearSlider" min="1820" max="2020" step="1" value="1820" />
    <div class="speedwrap">
      <span>Tempo</span>
      <select id="speedSelect">
        <option value="2">2 J/s</option>
        <option value="5" selected>5 J/s</option>
        <option value="10">10 J/s</option>
        <option value="20">20 J/s</option>
      </select>
    </div>
  </div>
  <div id="worldchart" class="hud"
    title="Klick setzt das Jahr">
    <div class="wc-title"><span>Welt gesamt · relativ zum Maximum</span></div>
    <svg id="wcSvg" viewBox="0 0 250 92" preserveAspectRatio="none"></svg>
    <div class="wc-title wc-second"><span>absolut (logarithmisch)</span></div>
    <svg id="wcSvgAbs" viewBox="0 0 250 92" preserveAspectRatio="none"></svg>
    <div class="wc-legend">
      <div class="row"><i style="background: var(--accent)"></i>
        <span class="nm">Bevölkerung</span>
        <span class="v" id="wcPop">–</span></div>
      <div class="row"><i style="background: var(--accent-warm)"></i>
        <span class="nm">Gesamtenergie</span>
        <span class="v" id="wcEnergy">–</span></div>
      <div class="row"><i style="background: #9ece6a"></i>
        <span class="nm">Energie pro Kopf</span>
        <span class="v" id="wcPerCap">–</span></div>
    </div>
  </div>
  <div id="tooltip"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
