# =====================================================================
# Entitätenregister (Plan §5.2)
# ---------------------------------------------------------------------
# Kanonische Zuordnung: Datensatz-Ländername -> Entität -> Geometrie.
#
#   id                 – kanonischer Entitäts-Schlüssel (entity_id)
#   display_name       – Anzeigename (deutsch, UI)
#   source_names       – Namen in der Faktengrundlage (CSV-Spalte Country)
#   geometry_members   – Natural-Earth ADM0_A3 Codes, die die Geometrie
#                        bilden (Dissolve); historische Aggregate = Liste
#   macroarea          – Makroregion-Code des Datensatzes (Af/As/EE/LA/
#                        ME/NAm/O/WE), "" für Restliche Welt
#   historical_aggregate –true, wenn die Entität ein historisches
#                        Aggregat ist (fließt in flags.u8, Bit 1)
#   is_other_world     – Rest-Welt-Entität (flags.u8, Bit 0)
#
# Reihenfolge = kanonischer Entitäts-Index in allen Export-Artefakten.
# =====================================================================

macroarea_labels:
  WE: Westeuropa
  EE: Osteuropa
  NAm: Nordamerika
  LA: Lateinamerika
  O: Ozeanien
  As: Asien
  ME: Naher Osten
  Af: Afrika
  "": Rest der Welt

